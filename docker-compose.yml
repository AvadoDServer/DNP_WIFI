version: '3.5'
networks:
  avado:
    external: true
services:
  wifi.dnp.dappnode.eth:
    image: 'wifi.dnp.dappnode.eth:10.0.2'
    container_name: DAppNodeCore-wifi.dnp.dappnode.eth
    build: ./build
    env_file:
      - wifi.dnp.dappnode.eth.env
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
    dns: 172.30.0.2
    privileged: true
    restart: always
    networks:
      avado:
        ipv4_address: 172.30.0.10
    logging:
      options:
        max-size: 10m
        max-file: '3'
